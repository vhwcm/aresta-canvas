# aresta-canvas uses SQLite — NO PostgreSQL container needed!
services:
  aresta-canvas:
    build: ./backend
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: "file:/app/data/aresta_canvas.db"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://localhost:3001}
      MEMORY_SERVICE_URL: ${MEMORY_SERVICE_URL:-http://localhost:3005}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://localhost:3002}
    volumes:
      - canvas-data:/app/data

volumes:
  canvas-data:
